      type: object
      properties:
        status:
          type: string
    conxai_com_docs-api_structures_api.BBox:
      type: object
      properties:
        coordinates:
          type: array
          items:
            type: number
        id:
          type: string
    api_documents_handlers.CopyToProjectRequest:
      type: object
      properties:
        project_id:
          type: string
    conxai_com_docs-api_structures_api.OnDemandProcessingRequest:
      type: object
      properties:
        document_type:
          type: string
        pages:
          type: array
          items:
            type: integer
    api_documents_handlers.FileStatus:
      type: object
      properties:
        document_ids:
          type: array
          items:
            type: string
        error:
          type: string
        file_id:
          type: string
        status:
          type: string
    conxai_com_docs-api_structures_api.BulkDocumentOperationStatus:
      type: object
      properties:
        message:
          type: string
          example: failed to delete S3 files
        status:
          type: string
          example: deleted
    conxai_com_docs-api_structures_api.Document:
      type: object
      properties:
        page_count:
          type: array
          items:
            type: integer
        uuid:
          type: string
    conxai_com_docs-api_structures_api.PredictionsStructure:
      type: object
      properties:
        document_type:
          type: string
        use_case:
          type: string
        version:
          type: integer
    conxai_com_docs-api_structures_api.DocumentPage:
      type: object
      properties:
        content:
          type: string
        id:
          type: string
        image:
          type: string
        image_high:
          type: string
        image_low:
          type: string
        ocr:
          type: string
        predictions: {}
        schema:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
        status:
          $ref: '#/components/schemas/conxai_com_docs-api_structures_sample.Status'
    conxai_com_docs-api_structures_api.BulkDocumentRequest:
      type: object
      properties:
        document_ids:
          type: array
          items:
            type: string
          example:
          - '["a1b2c3d4-e5f6-7890-abcd-ef1234567890"'
          - '"b2c3d4e5-f6a7-8901-bcde-f12345678901"]'
    api_documents_handlers.MultiFileStatusRequest:
      type: object
      properties:
        file_id:
          type: array
          items:
            type: string
    conxai_com_docs-api_structures_api.GetDocumentPagesResponse:
      type: object
      properties:
        id:
          type: string
        page_count:
          type: integer
        pages:
          type: array
          items:
            $ref: '#/components/schemas/conxai_com_docs-api_structures_api.PageData'
        predictions:
          $ref: '#/components/schemas/conxai_com_docs-api_structures_api.PagePredictions'
        status:
          $ref: '#/components/schemas/conxai_com_docs-api_structures_sample.Status'
