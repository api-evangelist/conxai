      type: object
      properties:
        completion_percentage:
          description: extractor_pages / page_count
          type: number
          example: 0.8
        extractor_pages:
          description: max is number of pages
          type: integer
          example: 1
        preprocessing_completion_percentage:
          description: (splitter + prerunner) / (2*page_count)
          type: number
          example: 0.6
        prerunner_pages:
          description: max is number of pages
          type: integer
          example: 8
        splitter_pages:
          description: max is number of pages
          type: integer
          example: 4
    conxai_com_docs-api_structures_api.GetPageDimensionsResponse:
      type: object
      properties:
        id:
          type: string
        page_count:
          type: integer
        page_dimensions:
          $ref: '#/components/schemas/conxai_com_docs-api_structures_api.PageDimensions'
    conxai_com_docs-api_structures_api.Documents:
      type: object
      properties:
        created_at:
          type: string
          example: '2025-08-11T08:45:58Z'
        created_by:
          type: string
          example: ''
        document_type:
          type: string
          example: 28ab4fe4-ceaf-49b0-bbfd-315bbf4fa0ff
        document_type_version:
          type: integer
          example: 1
        id:
          type: string
          example: fc5abcf4-bf5e-49a8-a5fc-49b41a59755b
        is_training_version_synced:
          description: 'IsTrainingVersionSynced indicates the training sync status:

            - nil: samples not copied to training at all

            - true: samples synced and up to date with latest version

            - false: samples synced but not the latest version'
          type: boolean
          example: true
        name:
          type: string
          example: sell_car_invoice000.pdf
        num_pages:
          type: integer
          example: 2
        original_id:
          type: string
          example: fc5abcf4-bf5e-49a8-a5fc-49b41a59755b
        pages_status:
          type: array
          items:
            $ref: '#/components/schemas/conxai_com_docs-api_structures_api.DocumentsPageStatus'
