aid: conxai
name: Conxai
description: >-
  Conxai (CONXAI Technologies GmbH) is a Munich, Germany-based startup building a
  no-code, agentic AI platform purpose-built for the construction and AEC
  (architecture, engineering, construction) industry. The modular platform
  contextualizes fragmented project-lifecycle data — site photos and video,
  documents, CAD drawings and tender submissions — and turns it into actionable
  knowledge across three areas: transparency, automation, and knowledge
  management. Marquee products include SiteLens (real-time construction-site
  camera analysis, progress tracking and firestop detection) and DocNostic
  (document extraction, classification and workflow automation). Conxai exposes
  several REST APIs — a Customer/SiteLens API, a Docnostic document API, a
  Firestop API and a Production Tracking API — documented on ReadMe and secured
  with an X-Api-Key header (Docnostic also accepts a JWT bearer token). The
  company is backed by Earlybird, Pi Labs, Cemex Ventures, Zacua Ventures,
  Capricorn Partners and BayBG Venture Capital.
